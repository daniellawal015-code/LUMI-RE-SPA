<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Spa - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <a href="index.html" class="login-logo">LUMIÈRE SPA</a>
    <h2>Welcome Back</h2>
    <p>Sign in to access your Member Hub and manage bookings.</p>

    <!-- Alert Box for Errors -->
    <div id="loginAlert" class="alert-box" style="display: none;"></div>

    <form id="loginForm">
      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="sophia@example.com" required>
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-pass">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <p class="signup-prompt">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value.trim();

      // Retrieve users from localStorage
      let users = JSON.parse(localStorage.getItem('lumiere_users')) || [];

      // Find user
      const foundUser = users.find(u => u.email === email);

      if (!foundUser) {
        // Show "Account not found" if email isn't in database
        showAlert('Account not found. Please create an account first.', 'error');
        return;
      }

      if (foundUser.password !== password) {
        showAlert('Incorrect password. Please try again.', 'error');
        return;
      }

      // Save logged-in session info
      localStorage.setItem('lumiere_current_user', JSON.stringify(foundUser));

      showAlert('Login successful! Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert-box ${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
