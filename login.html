<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Spa - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <a href="index.html" class="login-logo">LUMIÈRE SPA</a>
    <h2>Welcome Back</h2>
    <p>Sign in to access your Member Hub and manage bookings.</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="sophia@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-pass">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <p class="signup-prompt">
      Don't have an account? <a href="#">Create one</a>
    </p>
  </div>

  <script>
    // Redirect to dashboard on form submission
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
